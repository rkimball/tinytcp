name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute gtest tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: test/unit-test


  coverage:
    # Runs the unit tests with gcov instrumentation. Fails if a test fails or if line coverage is
    # below the minimums set in CMakeLists.txt (TINYTCP_COVERAGE_MIN_LINES and
    # TINYTCP_COVERAGE_MIN_LINES_OS).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install gcovr
      run: sudo apt-get update && sudo apt-get install -y gcovr

    - name: Configure CMake
      # Debug, not Release: optimization makes the line numbers meaningless
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DTINYTCP_COVERAGE=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel --target unit-test

    - name: Test and check coverage
      run: cmake --build ${{github.workspace}}/build --target coverage

    - name: Coverage summary
      if: always()
      run: |
        if [ -f build/coverage/summary.txt ]; then
          { echo '### Coverage'; echo '```'; cat build/coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload the coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage
